# Compila los instaladores en runners de GitHub:
#   - macOS: .dmg y .zip para Apple Silicon (arm64) e Intel (x64), con firma ad-hoc.
#   - Windows: instalador NSIS (.exe).
# Se ejecuta al subir un tag "v*" (crea un Release con los archivos) o manualmente desde Actions.
name: Build instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: serialport usa binarios N-API precompilados (universales en macOS)
      # y los aceleradores nativos opcionales de ssh2 no se necesitan.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Empaquetar .app (sin firma)
        run: npx electron-builder --mac dir --${{ matrix.arch }} --publish never -c.mac.identity=null

      # Sin firma, macOS marca la app como "danada" en Apple Silicon.
      # La firma ad-hoc la deja como "desarrollador no verificado", que el usuario puede autorizar.
      - name: Firma ad-hoc
        run: |
          APP="$(find dist -maxdepth 2 -name '*.app' -type d | head -n 1)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Crear .dmg y .zip
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never -c.mac.identity=null --prepackaged "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Crear instalador NSIS
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
